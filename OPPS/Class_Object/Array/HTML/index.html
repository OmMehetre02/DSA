<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management</title>
    <style>
        .f-div {
            background-color: rgb(240, 202, 137);
            padding: 10px; /* Added padding for better visual appearance */
        }
        table {
            width: 100%; /* Makes the table span the width of its container */
            border-collapse: collapse; /* Removes space between table borders */
            margin-top: 15px; /* Adds space below the header */
        }
        th, td {
            border: 1px solid #ddd; /* Adds borders to cells */
            padding: 8px; /* Adds space inside cells */
            text-align: left; /* Aligns text to the left */
        }
        th {
            background-color: rgb(221, 221, 221); /* Different background for headers */
        }
    </style>
</head>
<body>

<div class="f-div">
    <h1>Employee Management</h1>
</div>

<!-- Refactored to use a valid <table> structure -->
<div class="column">
    <table>
        <thead>
            <tr>
                <th>Emp ID</th>
                <th>Emp Name</th>
                <th>Emp Mobile No</th>
                <th>Emp Email-ID</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>om mehetre</td>
                <td>9865435468</td>
                <td>om@gmail.com</td>
            </tr>
            <!-- You can add more employee records here -->
            <!--
            <tr>
                <td>2</td>
                <td>jane doe</td>
                <td>1234567890</td>
                <td>jane@example.com</td>
            </tr>
            -->
        </tbody>
    </table>
</div>

</body>
</html>
