<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="../css/std_style.css">
</head>
<body>
   <div class="contener">
       <h1>Student Registration Form</h1>
       <div class="form-data">
        <form>
            <table>
                <tr>
                    <td><label for="fname"></label>Enter The Fullname</td>
                    <td><input type="text" name="fname" id="fname" placeholder="Enter your name"></td>
                </tr>
                 <tr>
                    <td><label for="age"></label>Enter The age</td>
                    <td><input type="number" name="age" id="fname" placeholder="Enter your age"></td>
                </tr>
                <tr>
                    <td><label for="Gender"></label>Select your gender</td>
                    <td><input type="radio" name="gender" id="gender" value="Male">male</td>
                     <td><input type="radio" name="gender" id="gender" value="feMale">female</td>
                      <td><input type="radio" name="gender" id="gender" value="others">others</td>
                </tr>
                 <tr>
                    <td><label for="DOB"> Date Of Birth</label></td>
                    <td><input type="date" name="dob" id="DOB" ></td>
                </tr>
            </table>
        </form>

       </div>
    </div>
    
</body>
</html>
