<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Project</title>

    <!-- Correct CSS link -->
    <link rel="stylesheet" href="../css/style.css">
</head>
 <body>
    <div class="box">
      <h1>Student Registration Form</h1>
      <div class="form-data">
        <form>
          <table>
            <tr>
              <td><label for="fullname">Enter Your FullName</label></td>
              <td>
                <input
                  type="text"
                  id="fullname"
                  name="fullname"
                  placeholder="Enter fullname here"
                  autocomplete="off"
                  spellcheck="true"
                />
                <span class="validation">
                  (fullname shoud be atleast 30 character long)</span
                >
              </td>
            </tr>

            <tr>
              <td><label for="age">Enter Your Age</label></td>
              <td>
                <input
                  type="number"
                  id="age"
                  name="age"
                  placeholder="Enter age here"
                  autocomplete="off"
                />
                <span class="validation"> (age in between 0 to 100)</span>
              </td>
            </tr>

            <tr>
              <td><label for="gender">Select Your Gender</label></td>
              <td>
                <input type="radio" name="gender" id="gender" value="male" />
                Male
                <input type="radio" name="gender" id="gender" value="female" />
                Female

                <input type="radio" name="gender" id="gender" value="other" />
                Other
              </td>
            </tr>

            <tr>
              <td><label for="email">Enter Your Email</label></td>
              <td>
                <input
                  type="email"
                  id="email"
                  name="email"
                  placeholder="Enter email here"
                  autocomplete="off"
                />
                <span class="validation"> (please enter proper email)</span>
              </td>
            </tr>

             <tr>
              <td><label for="mobile">Enter Your mobile number</label></td>
              <td>
                <input
                  type="number"
                  id="mobile"
                  name="mobile"
                  placeholder="Enter mobile number"
                  autocomplete="off"
                />
                <span class="validation"> (Enter 10 Digit only)</span>
              </td>
            </tr>
            
             <tr>
              <td><label for="birth-date">Enter Your birth-date</label></td>
              <td>
                <input
                  type="date"
                  id="birth-date"
                  name="birth-date"
                  placeholder="Enter birth-date "
                  autocomplete="off"
                />
                <span class="validation"> (Enter right date of birth)</span>
              </td>
            </tr>
            <tr>
                <td><label >Select Your Country</label></td>
                <td>
               <select name="country" id="country">
              <option value=""> select your country</option>
              <option value="india">india</option>
                <option value="america">america</option>
                  <option value="shrilanka">shrilanka</option>
                    <option value="bangladesh">bangladesh</option>
                    </select>
                     </td>
            </tr>
            <tr>
                <td><label for="fileupload">upload image</label></td>
                <td>
                    <input type="file"
                           id="fileupload"
                           name="fileupload"
                           placeholder="upload your photo"
                           autocomplete="off"

                    >
                </td>
                
            </tr>
           <tr >
            <td><label for="submit">submit your form</label></td>
            <td>
                <input type="submit" 
                name="submit" 
                id="submit"
                value="Register"

                
                
                >
                <input type="submit"
                name="reset"
                id="reset"
                value="reset"
                >

            </td>
           </tr>
          </table>
        </form>
      </div>
    </div>
  </body>
</html>
